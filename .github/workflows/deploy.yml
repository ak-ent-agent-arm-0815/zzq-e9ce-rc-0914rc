name: deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: read production secret
        env:
          S: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          echo "S: $S"
          echo "secret_len=${#S}"
          printf '%s' "$S" | sha256sum | cut -c1-32 | sed 's/^/secret_sha256_prefix=/'
          echo "STEPS=1"
